[workspace]
resolver = "2"
members = ["crates/perp-domain", "crates/perp-app", "crates/perp-infra", "crates/perp-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kienpt91/perp-engine"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
debug-assertions = false
lto = "thin"
codegen-units = 4
panic = "unwind"

[profile.dev]
overflow-checks = true
